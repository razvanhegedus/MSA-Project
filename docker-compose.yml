services:
  db:
    image: postgres:16
    container_name: pitch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pitch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pitch_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
